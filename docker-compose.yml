services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_BACKEND_URL=http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GCAL_MCP_URL=http://gcal-mcp:8090
    depends_on:
      - gcal-mcp

  gcal-mcp:
    build: ./gcal-mcp
    ports:
      - "8090:8090"
