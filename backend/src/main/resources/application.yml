spring:
  application:
    name: calendar-assistant-backend

  ai:
    # LLM: Groq (OpenAI-compatible, free tier, supports function calling)
    # To switch to Gemini native, replace with spring-ai-vertex-ai-gemini-spring-boot-starter
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile


server:
  port: 8080

logging:
  level:
    com.calendarassistant: DEBUG
    org.springframework.ai: INFO
