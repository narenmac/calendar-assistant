spring:
  application:
    name: calendar-assistant-backend

  ai:
    # LLM: Groq (OpenAI-compatible, free tier, supports function calling)
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile

    # Disable Boot autoconfiguration — MCP client is created per-request in ScheduleService
    mcp:
      client:
        enabled: false

# gcal-mcp service URL (override via env var in Docker/Azure)
GCAL_MCP_URL: http://localhost:8090


server:
  port: 8080

logging:
  level:
    com.calendarassistant: DEBUG
    org.springframework.ai: INFO
