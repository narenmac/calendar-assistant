name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_FRONTEND: naren433/cal-frontend
  IMAGE_BACKEND:  naren433/cal-backend
  IMAGE_GCAL_MCP: naren433/cal-gcal-mcp
  RESOURCE_GROUP: calendar-assistant-rg

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push gcal-mcp
        uses: docker/build-push-action@v6
        with:
          context: ./gcal-mcp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_GCAL_MCP }}:latest
            ${{ env.IMAGE_GCAL_MCP }}:${{ steps.sha.outputs.short }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ steps.sha.outputs.short }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_BACKEND_URL=${{ secrets.BACKEND_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ steps.sha.outputs.short }}

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy gcal-mcp
        run: |
          az containerapp update \
            --name gcal-mcp \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_GCAL_MCP }}:${{ needs.build-and-push.outputs.sha }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_BACKEND }}:${{ needs.build-and-push.outputs.sha }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_FRONTEND }}:${{ needs.build-and-push.outputs.sha }}
